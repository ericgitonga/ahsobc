<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 825" width="1200" height="825" role="img" aria-label="1932 Track and Field Senior Squad archival photograph">
  <defs>
    <linearGradient id="sepiaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8cbb8"/>
      <stop offset="60%" stop-color="#bfa98e"/>
      <stop offset="100%" stop-color="#7c6348"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#23170b" stop-opacity="0.62"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="825" fill="url(#sepiaSky)"/>
  <!-- Old Gymnasium Gable & Kikuyu Trees -->
  <polygon points="140,420 600,210 1060,420" fill="#6b533b" opacity="0.65"/>
  <rect x="200" y="420" width="800" height="190" fill="#82684d" opacity="0.7"/>
  <rect x="0" y="575" width="1200" height="250" fill="#5e4731"/>
  <!-- Standing Back Row (Row 2) -->
  <g fill="#2e2115">
    <circle cx="290" cy="405" r="28"/><rect x="256" y="438" width="68" height="150" rx="14"/>
    <circle cx="410" cy="398" r="28"/><rect x="376" y="431" width="68" height="155" rx="14"/>
    <circle cx="535" cy="392" r="29"/><rect x="500" y="426" width="70" height="160" rx="14"/>
    <circle cx="665" cy="395" r="28"/><rect x="631" y="428" width="68" height="158" rx="14"/>
    <circle cx="790" cy="400" r="28"/><rect x="756" y="433" width="68" height="153" rx="14"/>
    <circle cx="910" cy="408" r="27"/><rect x="877" y="440" width="66" height="148" rx="14"/>
  </g>
  <!-- Seated Front Row (Row 1) - Position 3 from left matches xywh=420,310,180,220 scaled -->
  <g fill="#f3eadc" stroke="#3a2a1b" stroke-width="3">
    <circle cx="235" cy="500" r="29" fill="#3a2a1b"/><rect x="198" y="534" width="74" height="145" rx="12"/>
    <circle cx="365" cy="495" r="29" fill="#3a2a1b"/><rect x="328" y="529" width="74" height="148" rx="12"/>
    <!-- Highlighted Position 3: Snr. Master Elijah Kariuki (#118) holding Inter-House Shield -->
    <circle cx="505" cy="488" r="32" fill="#3a2a1b"/><rect x="465" y="525" width="80" height="155" rx="12"/>
    <circle cx="655" cy="494" r="29" fill="#3a2a1b"/><rect x="618" y="528" width="74" height="148" rx="12"/>
    <circle cx="795" cy="498" r="29" fill="#3a2a1b"/><rect x="758" y="532" width="74" height="146" rx="12"/>
    <circle cx="935" cy="502" r="29" fill="#3a2a1b"/><rect x="898" y="536" width="74" height="142" rx="12"/>
  </g>
  <!-- AHS Inter-House Athletics Shield -->
  <path d="M555,565 L615,565 L615,620 C615,655 585,675 585,675 C585,675 555,655 555,620 Z" fill="#3b2816" stroke="#d8cbb8" stroke-width="4"/>
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e9decb" letter-spacing="3">ALLIANCE HIGH SCHOOL · TRACK &amp; FIELD SQUAD · CIRCA 1930–1932</text>
  <rect width="1200" height="825" fill="url(#vignette)"/>
</svg>
