[info]
name = "AHSOBC Centennial Archive Theme"
version = "0.2.0"
author = "Alliance High School Old Boys Club"
description = "Centennial (1926-2026) Omeka S theme for the Alliance High School Old Boys Club, featuring an interactive 100-year decade timeline scrubber, House and Class Cohort faceting, embedded Mirador IIIF deep-zoom viewer, and 40-year Alumni Profile lifespan comparisons."
theme_link = "https://www.ahsobc.or.ke/gallery/"
author_link = "https://www.ahsobc.or.ke/"
omeka_version_constraint = "^4.0.0"

[config]
elements.accent_color.name = "accent_color"
elements.accent_color.type = "Laminas\Form\Element\Color"
elements.accent_color.options.label = "AHS Shield Accent Color"
elements.accent_color.attributes.value = "#0b8ed5"

elements.centennial_banner.name = "centennial_banner"
elements.centennial_banner.type = "Laminas\Form\Element\Text"
elements.centennial_banner.options.label = "Centennial Tagline"
elements.centennial_banner.attributes.value = "Strong to Serve • 100 Years of Visual History (1926–2026)"
